[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-queueing-lab"
version = "0.2.0"
description = "Finite-capacity queueing experiments with an ONNX Runtime GenAI adapter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
hardware = ["numpy>=1.26"]
rl = ["numpy>=1.26"]
test = ["pytest>=8"]

[project.scripts]
queueing-lab = "queueing_lab.cli:main"

[tool.setuptools.packages.find]
include = ["queueing_lab*", "cache_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
