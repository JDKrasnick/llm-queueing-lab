name: Research artifact checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[plots,test]'
      - run: python -m pytest -q
      - run: python -m queueing_lab capacity
      # Hardware results require an actual Engine/model; CI does not claim GPU validation.
